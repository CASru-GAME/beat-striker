behaviors:
  Satan:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 7
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      # C#側（MLAiBrain.cs）で BEAT_STACK_COUNT=4 として
      # 過去の履歴をObservation（74次元）内に持たせているため、
      # ML-Agents側のRNNオプション（memory）やStacked Vectorsへの依存は不要です。
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.2
        network_settings:
          hidden_units: 128
        learning_rate: 3.0e-4
    behavioral_cloning:
      demo_path: ../beat-striker/Dist/Demonstration/Training-Warrior
      strength: 0.3
      # BCの学習率を減衰させる累計Agentステップ数（並列環境の合計）。
      # buffer_size=20480で約50回更新し、その後は報酬による学習を続ける。
      steps: 1024000
      batch_size: 64
      num_epoch: 3
    # 2P同時学習は行わないため、self_playブロックは記述していません。
    keep_checkpoints: 10
    checkpoint_interval: 102400
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 2048

engine_settings:
  time_scale: 7
  target_frame_rate: -1
  capture_frame_rate: 60

environment_parameters: {}

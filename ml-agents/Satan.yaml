behaviors:
  Satan:
    trainer_type: ppo
    hyperparameters:
      batch_size: 1024
      buffer_size: 10240
      learning_rate: 3.0e-4
      beta: 5.0e-2
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 7
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      # C#側（MLAiBrain.cs）で BEAT_STACK_COUNT=4 として
      # 過去の履歴をObservation（74次元）内に持たせているため、
      # ML-Agents側のRNNオプション（memory）やStacked Vectorsへの依存は不要です。
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.2
        network_settings:
          hidden_units: 128
        learning_rate: 3.0e-4
    # 2P同時学習は行わないため、self_playブロックは記述していません。
    keep_checkpoints: 10
    checkpoint_interval: 20480
    max_steps: 10000000
    time_horizon: 128
    summary_freq: 1024

engine_settings:
  time_scale: 7
  target_frame_rate: -1
  capture_frame_rate: 60

environment_parameters: {}

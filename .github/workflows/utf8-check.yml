name: Convert SJIS .cs to UTF-8

on: [push, pull_request]

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}

      - name: Install nkf
        run: sudo apt-get update && sudo apt-get install -y nkf

      - name: Convert SJIS to UTF-8
        run: |
          #!/usr/bin/env bash
          set -euo pipefail

          ROOT="."
          changed=0

          find "$ROOT" -type f -name "*.cs" -print0 | while IFS= read -r -d '' f; do
            enc="$(nkf -g "$f" 2>/dev/null || echo unknown)"
            enc_lc="$(printf '%s' "$enc" | tr '[:upper:]' '[:lower:]')"

            if [[ "$enc_lc" == utf-8* || "$enc_lc" == ascii* ]]; then
              echo "skip (already $enc): $f"
              continue
            fi

            if [[ "$enc_lc" == *shift_jis* || "$enc_lc" == sjis* || "$enc_lc" == cp932* || "$enc_lc" == *windows-31j* ]]; then
              nkf -w --overwrite -- "$f"
              echo "converted (SJIS -> UTF-8): $f  [detected: $enc]"
              changed=1
            else
              echo "unknown encoding ($enc): $f"
            fi
          done

          # 状態を後段に渡すためにファイルに保存
          echo "$changed" > /tmp/changed.flag

      - name: Commit and push changes
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
        run: |
          changed=$(cat /tmp/changed.flag || echo 0)
          if [ "$changed" -eq 1 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: convert .cs files to UTF-8"
            git push
          else
            echo "No changes to commit."
          fi

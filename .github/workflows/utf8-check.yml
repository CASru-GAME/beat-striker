name: Enforce UTF-8 (no BOM) for C#

on: [push, pull_request]

permissions:
  contents: write   # 自動コミットに必要（同一リポ/ブランチのみ）

jobs:
  utf8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 変換用ツールの導入（日本語判定に強い nkf を使用）
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nkf

      # ① 自動修正（BOM除去 + 正しいUTF-8化）
      - name: Fix encoding to UTF-8 (no BOM)
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(git ls-files -z '*.cs')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .cs files — skipping fix."
            exit 0
          fi

          changed=0
          for f in "${files[@]}"; do
            # --- BOM の除去 ---
            if head -c3 "$f" | grep -q $'\xEF\xBB\xBF'; then
              echo "Removing BOM: $f"
              tail -c +4 "$f" > "$f.nobom" && mv "$f.nobom" "$f"
              changed=1
            fi

            # --- UTF-8 妥当性チェック（失敗なら変換）---
            if ! iconv -f utf-8 -t utf-8 "$f" -o /dev/null 2>/dev/null; then
              echo "Converting to UTF-8: $f"
              # nkf は入力文字コードを自動判定し UTF-8 (no BOM) に変換
              if ! nkf --overwrite -w8 --no-bom "$f"; then
                # 念のため CP932 を明示指定して再トライ
                iconv -f CP932 -t UTF-8 "$f" -o "$f.utf8" && mv "$f.utf8" "$f" || {
                  echo "Failed to convert: $f"
                  exit 1
                }
              fi
              changed=1
            fi
          done

          if [ $changed -eq 0 ]; then
            echo "No encoding fixes were needed."
          fi

      # ② 検証（UTF-8/BOMなしが担保されたか再チェック）
      - name: Verify .cs encoding is UTF-8 without BOM
        shell: bash
        run: |
          set -euo pipefail

          mapfile -d '' files < <(git ls-files -z '*.cs')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No .cs files — skipping verify."
            exit 0
          fi

          bad=""
          bom=""
          for f in "${files[@]}"; do
            enc=$(file -b --mime-encoding "$f")
            # ASCII は UTF-8 の部分集合として許容
            if [[ "$enc" != "utf-8" && "$enc" != "us-ascii" ]]; then
              bad+="$f ($enc)\n"
            fi
            if file "$f" | grep -q 'with BOM'; then
              bom+="$f\n"
            fi
            # 文字化け対策に追加の妥当性チェック
            if ! iconv -f utf-8 -t utf-8 "$f" -o /dev/null 2>/dev/null; then
              bad+="$f (invalid utf-8)\n"
            fi
          done

          if [ -n "$bad" ] || [ -n "$bom" ]; then
            echo "::error::エンコーディング違反を検出しました（自動修正後の検証で失敗）"
            [ -n "$bad" ] && echo -e "UTF-8/ASCII 以外 or 不正UTF-8:\n$bad"
            [ -n "$bom" ] && echo -e "BOM 付き:\n$bom"
            exit 1
          fi

          echo "✅ All .cs files are UTF-8 without BOM."

      # ③ 変更があれば自動コミット＆プッシュ
      # push イベント、または 同一リポジトリの PR のときのみ実行（fork PR は権限がないためスキップ）
      - name: Commit and push fixes (if any)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false)
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "ci: normalize .cs encoding to UTF-8 (no BOM)"
            git push
          else
            echo "No changes to commit."
          fi

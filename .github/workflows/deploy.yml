name: Deploy Sakura API

on:
  push:
    branches: [main]
    paths:
      - 'cloud/sakura/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'cloud/sakura/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: php -l cloud/sakura/www/beat-striker/index.php
      - name: Test HTTP API with SQLite
        run: python3 cloud/sakura/tests/test_api.py

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: sakura-api-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Upload API over FTPS and verify HTTP endpoints
        shell: pwsh
        env:
          SAKURA_FTP_USERNAME: ${{ secrets.SAKURA_FTP_USERNAME }}
          SAKURA_FTP_PASSWORD: ${{ secrets.SAKURA_FTP_PASSWORD }}
          SAKURA_FTP_HOST: ${{ vars.SAKURA_FTP_HOST || 'rintify.sakura.ne.jp' }}
          SAKURA_FTP_DIRECTORY: ${{ vars.SAKURA_FTP_DIRECTORY || '/www/beat-striker' }}
          SAKURA_API_BASE_URL: ${{ vars.SAKURA_API_BASE_URL || 'https://rintify.sakura.ne.jp/beat-striker' }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('SAKURA_FTP_USERNAME', 'SAKURA_FTP_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "GitHub Actions secret $name is required. Register it in Settings > Secrets and variables > Actions."
            }
          }
          $password = ConvertTo-SecureString $env:SAKURA_FTP_PASSWORD -AsPlainText -Force
          $credential = [PSCredential]::new($env:SAKURA_FTP_USERNAME, $password)
          ./cloud/sakura/Upload-SakuraApi.ps1 `
            -FtpHost $env:SAKURA_FTP_HOST `
            -RemoteDirectory $env:SAKURA_FTP_DIRECTORY `
            -ApiBaseUrl $env:SAKURA_API_BASE_URL `
            -Credential $credential
